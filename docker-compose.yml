x-app: &app
  build: .
  image: firstreport-app
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://fr:fr@postgres:5432/fr

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fr
      POSTGRES_PASSWORD: fr
      POSTGRES_DB: fr
    ports:
      # Localhost only, so the database is not reachable from outside the VPS.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  worker:
    <<: *app
    command: ["pnpm", "worker:start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["app"]

  api:
    <<: *app
    command: ["pnpm", "api:start"]
    ports:
      # Cloudflare (or a reverse proxy) sits in front of this port.
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["app"]

volumes:
  pgdata:
